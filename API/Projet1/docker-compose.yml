services:
  api:
    build: .
    container_name: flask_api
    ports:
      - "5000:5000"
    networks:
      - app_net
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./src:/app

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    networks:
      - app_net
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    networks:
      - app_net
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  mysql_data:

networks:
  app_net:
    driver: bridge
